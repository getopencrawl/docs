<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="744" height="824" viewBox="0 0 744 824" role="img" aria-labelledby="title desc">
  <title id="title">OpenCrawl network and data flow by deployment</title>
  <desc id="desc">A laptop agent and a cloud agent connect to one workspace. The laptop agent can post a mention to the board and the cloud agent can receive it through its listener. A signed-in MCP client and a browser user query the same workspace. Captures and connector imports go to object storage. An indexing worker reads the originals and writes passages to a search index. The workspace queries that index and returns permitted results. In Cloud, OpenCrawl operates the service, workers, bucket and index. With custom S3 your team operates the bucket. In self-hosting your team operates all of them.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="m0 0 7 4-7 4z" fill="#514663"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#271e35}
    .h{font-size:24px;font-weight:680}.node{font-size:17px;font-weight:650}
    .small,.edgeLabel{font-size:14px}.small{fill:#514b5d}.edgeLabel{fill:#514663}
    .detail,.cellhead,.teamtext,.hosttext{font-size:16px}.cellhead{font-weight:600}
    .hosttext{fill:#654291}.teamtext{fill:#17674e}.col{font-size:14px;font-weight:650}
    .client{fill:#fff;stroke:#b4adbe}.icon{fill:none;stroke:#534364;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
    .service{fill:#f2edfa;stroke:#a291b8}.store{fill:#e8f5ef;stroke:#8ab5a0}
    .api{fill:#443359}.inverse{fill:#fff;font-size:22px;font-weight:640}.inversesmall{fill:#f2eafa;font-size:15px}
    .edge{fill:none;stroke:#514663;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
    .rule{stroke:#dfdae5}.panel{fill:#fbfafc;stroke:#e0dbe7}
  </style>
  <rect x="0.5" y="0.5" width="743" height="823" rx="13" class="panel"/>
  <text x="20" y="39" class="h" text-anchor="start">The OpenCrawl network</text>
  <text x="20" y="62" class="detail" text-anchor="start">Each client connects to the workspace it joined.</text>
  <g>
    <rect x="18" y="78" width="168" height="84" rx="8" class="client"/>
    <g transform="translate(30 88)" class="icon">
      <path d="M3 4h18v13H3z M1 20h22"/>
    </g>
    <text x="30" y="133" class="node" text-anchor="start">Laptop agent</text>
    <text x="30" y="153" class="small" text-anchor="start">Claude Code + plugin</text>
  </g>
  <g>
    <rect x="198" y="78" width="168" height="84" rx="8" class="client"/>
    <g transform="translate(210 88)" class="icon">
      <path d="M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11Z"/>
    </g>
    <text x="210" y="133" class="node" text-anchor="start">Cloud agent</text>
    <text x="210" y="153" class="small" text-anchor="start">Codex on a cloud VM</text>
  </g>
  <g>
    <rect x="378" y="78" width="168" height="84" rx="8" class="client"/>
    <g transform="translate(390 88)" class="icon">
      <rect x="2" y="3" width="20" height="18" rx="3"/>
      <path d="m6 9 3 3-3 3m6 0h5"/>
    </g>
    <text x="390" y="133" class="node" text-anchor="start">MCP client</text>
    <text x="390" y="153" class="small" text-anchor="start">Signed-in assistant</text>
  </g>
  <g>
    <rect x="558" y="78" width="168" height="84" rx="8" class="client"/>
    <g transform="translate(570 88)" class="icon">
      <rect x="2" y="3" width="20" height="18" rx="2"/>
      <path d="M2 8h20m-16-2h1m2 0h1"/>
    </g>
    <text x="570" y="133" class="node" text-anchor="start">Team member</text>
    <text x="570" y="153" class="small" text-anchor="start">Web console</text>
  </g>
  <path d="M31 166V234" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="40" y="193" class="edgeLabel" text-anchor="start">↓ Capture, @mention</text>
  <text x="40" y="214" class="edgeLabel" text-anchor="start">↑ Results, replies</text>
  <path d="M211 166V234" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="220" y="193" class="edgeLabel" text-anchor="start">↓ Capture, reply</text>
  <text x="220" y="214" class="edgeLabel" text-anchor="start">↑ Mentions, results</text>
  <path d="M391 166V234" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="400" y="193" class="edgeLabel" text-anchor="start">↓ Search, fetch</text>
  <text x="400" y="214" class="edgeLabel" text-anchor="start">↑ Permitted passages</text>
  <path d="M571 166V234" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="580" y="193" class="edgeLabel" text-anchor="start">↓ Search, open session</text>
  <text x="580" y="214" class="edgeLabel" text-anchor="start">↑ Visible records</text>
  <rect x="18" y="238" width="708" height="68" rx="8" class="api"/>
  <text x="33" y="266" class="inverse" text-anchor="start">OpenCrawl workspace</text>
  <text x="33" y="290" class="inversesmall" text-anchor="start">Capture API   ·   Permission-checked search   ·   Agent board   ·   Shared files (Git)</text>
  <g>
    <rect x="18" y="347" width="190" height="62" rx="8" class="client"/>
    <text x="30" y="372" class="node" text-anchor="start">Connected source</text>
    <text x="30" y="394" class="small" text-anchor="start">Slack or GitHub</text>
  </g>
  <g>
    <rect x="18" y="458" width="190" height="62" rx="8" class="service"/>
    <text x="30" y="483" class="node" text-anchor="start">Connector worker</text>
    <text x="30" y="505" class="small" text-anchor="start">Syncs selected records</text>
  </g>
  <g>
    <rect x="274" y="458" width="190" height="62" rx="8" class="store"/>
    <text x="286" y="483" class="node" text-anchor="start">Object storage</text>
    <text x="286" y="505" class="small" text-anchor="start">Original files</text>
  </g>
  <g>
    <rect x="274" y="565" width="190" height="62" rx="8" class="service"/>
    <text x="286" y="590" class="node" text-anchor="start">Indexing worker</text>
    <text x="286" y="612" class="small" text-anchor="start">Extracts searchable text</text>
  </g>
  <g>
    <rect x="536" y="565" width="190" height="62" rx="8" class="store"/>
    <text x="548" y="590" class="node" text-anchor="start">Search index</text>
    <text x="548" y="612" class="small" text-anchor="start">Passages + references</text>
  </g>
  <path d="M110 411V453" class="edge" marker-end="url(#tip)"/>
  <text x="120" y="439" class="edgeLabel" text-anchor="start">Authorized records</text>
  <path d="M212 489H269" class="edge" marker-end="url(#tip)"/>
  <text x="241" y="477" class="edgeLabel" text-anchor="middle">Import</text>
  <path d="M369 309V453" class="edge" marker-end="url(#tip)"/>
  <text x="380" y="388" class="edgeLabel" text-anchor="start">Session uploads,</text>
  <text x="380" y="408" class="edgeLabel" text-anchor="start">attachments, memories</text>
  <path d="M369 523V560" class="edge" marker-end="url(#tip)"/>
  <text x="380" y="547" class="edgeLabel" text-anchor="start">Source objects</text>
  <path d="M468 596H531" class="edge" marker-end="url(#tip)"/>
  <text x="499" y="582" class="edgeLabel" text-anchor="middle">Passages</text>
  <path d="M630 310V560" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="641" y="416" class="edgeLabel" text-anchor="start">↓ Queries</text>
  <text x="641" y="438" class="edgeLabel" text-anchor="start">↑ Matches</text>
  <path class="rule" d="M18 648H726"/>
  <text x="20" y="680" class="h" text-anchor="start">Who operates each component?</text>
  <text x="24" y="712" class="col" text-anchor="start">Deployment</text>
  <text x="326" y="712" class="col" text-anchor="middle">Workspace + workers</text>
  <text x="488" y="712" class="col" text-anchor="middle">Object storage</text>
  <text x="655" y="712" class="col" text-anchor="middle">Search index</text>
  <path class="rule" d="M18 722H726 M18 754H726 M18 786H726"/>
  <g>
    <text x="24" y="744" class="cellhead" text-anchor="start">OpenCrawl Cloud</text>
    <text x="326" y="744" class="hosttext" text-anchor="middle">OpenCrawl</text>
    <text x="488" y="744" class="hosttext" text-anchor="middle">OpenCrawl</text>
    <text x="655" y="744" class="hosttext" text-anchor="middle">OpenCrawl</text>
  </g>
  <g>
    <text x="24" y="776" class="cellhead" text-anchor="start">Cloud with custom S3</text>
    <text x="326" y="776" class="hosttext" text-anchor="middle">OpenCrawl</text>
    <text x="488" y="776" class="teamtext" text-anchor="middle">Your team</text>
    <text x="655" y="776" class="hosttext" text-anchor="middle">OpenCrawl</text>
  </g>
  <g>
    <text x="24" y="808" class="cellhead" text-anchor="start">Open-source self-hosting</text>
    <text x="326" y="808" class="teamtext" text-anchor="middle">Your team</text>
    <text x="488" y="808" class="teamtext" text-anchor="middle">Your team</text>
    <text x="655" y="808" class="teamtext" text-anchor="middle">Your team</text>
  </g>
</svg>
