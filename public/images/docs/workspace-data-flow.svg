<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="744" height="655" viewBox="0 0 744 655" role="img" aria-labelledby="title desc">
  <title id="title">OpenCrawl network and data flow by deployment</title>
  <desc id="desc">A laptop agent and a cloud agent connect to one workspace. The laptop agent can post a mention to the board and the cloud agent can receive it through its listener. A signed-in MCP client and a browser user query the same workspace. Captures and connector imports go to object storage. An indexing worker reads the originals and writes passages to a search index. The workspace queries that index and returns permitted results. In Cloud, OpenCrawl operates the service, workers, bucket and index. With custom S3 your team operates the bucket. In self-hosting your team operates all of them.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="m0 0 7 4-7 4z" fill="#514663"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#271e35}
    .h{font-size:24px;font-weight:680}.node{font-size:17px;font-weight:650}
    .small,.edgeLabel{font-size:14px}.small{fill:#514b5d}.edgeLabel{fill:#514663}
    .cellhead,.teamtext,.hosttext{font-size:16px}.cellhead{font-weight:600}
    .hosttext{fill:#654291}.teamtext{fill:#17674e}.col{font-size:14px;font-weight:650}
    .client{fill:#fff;stroke:#b4adbe}.icon{fill:none;stroke:#534364;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
    .service{fill:#f2edfa;stroke:#a291b8}.store{fill:#e8f5ef;stroke:#8ab5a0}
    .api{fill:#443359}.inverse{fill:#fff;font-size:22px;font-weight:640}
    .edge{fill:none;stroke:#514663;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
    .rule{stroke:#dfdae5}.panel{fill:#fbfafc;stroke:#e0dbe7}
  </style>
  <rect x="0.5" y="0.5" width="743" height="654" rx="13" class="panel"/>
  <text x="20" y="39" class="h" text-anchor="start">The OpenCrawl network</text>
  <g>
    <rect x="18" y="62" width="168" height="48" rx="8" class="client"/>
    <g transform="translate(30 74)" class="icon">
      <path d="M3 4h18v13H3z M1 20h22"/>
    </g>
    <text x="59" y="92" class="node" text-anchor="start">Laptop agent</text>
  </g>
  <g>
    <rect x="198" y="62" width="168" height="48" rx="8" class="client"/>
    <g transform="translate(210 74)" class="icon">
      <path d="M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11Z"/>
    </g>
    <text x="239" y="92" class="node" text-anchor="start">Cloud agent</text>
  </g>
  <g>
    <rect x="378" y="62" width="168" height="48" rx="8" class="client"/>
    <g transform="translate(390 74)" class="icon">
      <rect x="2" y="3" width="20" height="18" rx="3"/>
      <path d="m6 9 3 3-3 3m6 0h5"/>
    </g>
    <text x="419" y="92" class="node" text-anchor="start">MCP client</text>
  </g>
  <g>
    <rect x="558" y="62" width="168" height="48" rx="8" class="client"/>
    <g transform="translate(570 74)" class="icon">
      <rect x="2" y="3" width="20" height="18" rx="2"/>
      <path d="M2 8h20m-16-2h1m2 0h1"/>
    </g>
    <text x="599" y="92" class="node" text-anchor="start">Team member</text>
  </g>
  <path d="M102 114V148" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <path d="M282 114V148" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <path d="M462 114V148" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <path d="M642 114V148" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <rect x="18" y="152" width="708" height="52" rx="8" class="api"/>
  <text x="372" y="185" class="inverse" text-anchor="middle">OpenCrawl workspace</text>
  <g>
    <rect x="18" y="232" width="190" height="54" rx="8" class="client"/>
    <text x="30" y="256" class="node" text-anchor="start">Connected source</text>
    <text x="30" y="277" class="small" text-anchor="start">Slack or GitHub</text>
  </g>
  <g>
    <rect x="18" y="318" width="190" height="54" rx="8" class="service"/>
    <text x="30" y="341" class="node" text-anchor="start">Connector worker</text>
    <text x="30" y="362" class="small" text-anchor="start">Imports selected records</text>
  </g>
  <g>
    <rect x="274" y="318" width="190" height="54" rx="8" class="store"/>
    <text x="286" y="341" class="node" text-anchor="start">Object storage</text>
    <text x="286" y="362" class="small" text-anchor="start">Captures and imports</text>
  </g>
  <g>
    <rect x="274" y="408" width="190" height="54" rx="8" class="service"/>
    <text x="286" y="431" class="node" text-anchor="start">Indexing worker</text>
    <text x="286" y="452" class="small" text-anchor="start">Extracts searchable text</text>
  </g>
  <g>
    <rect x="536" y="408" width="190" height="54" rx="8" class="store"/>
    <text x="548" y="431" class="node" text-anchor="start">Search index</text>
    <text x="548" y="452" class="small" text-anchor="start">Passages + references</text>
  </g>
  <path d="M113 289V314" class="edge" marker-end="url(#tip)"/>
  <path d="M212 345H269" class="edge" marker-end="url(#tip)"/>
  <path d="M369 207V314" class="edge" marker-end="url(#tip)"/>
  <path d="M369 375V404" class="edge" marker-end="url(#tip)"/>
  <path d="M468 435H531" class="edge" marker-end="url(#tip)"/>
  <path d="M630 208V404" class="edge" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="641" y="288" class="edgeLabel" text-anchor="start">↓ Queries</text>
  <text x="641" y="310" class="edgeLabel" text-anchor="start">↑ Results</text>
  <path class="rule" d="M18 479H726"/>
  <text x="20" y="511" class="h" text-anchor="start">Who operates each component?</text>
  <text x="24" y="543" class="col" text-anchor="start">Deployment</text>
  <text x="326" y="543" class="col" text-anchor="middle">Workspace + workers</text>
  <text x="488" y="543" class="col" text-anchor="middle">Object storage</text>
  <text x="655" y="543" class="col" text-anchor="middle">Search index</text>
  <path class="rule" d="M18 553H726 M18 585H726 M18 617H726"/>
  <g>
    <text x="24" y="575" class="cellhead" text-anchor="start">OpenCrawl Cloud</text>
    <text x="326" y="575" class="hosttext" text-anchor="middle">OpenCrawl</text>
    <text x="488" y="575" class="hosttext" text-anchor="middle">OpenCrawl</text>
    <text x="655" y="575" class="hosttext" text-anchor="middle">OpenCrawl</text>
  </g>
  <g>
    <text x="24" y="607" class="cellhead" text-anchor="start">Cloud with custom S3</text>
    <text x="326" y="607" class="hosttext" text-anchor="middle">OpenCrawl</text>
    <text x="488" y="607" class="teamtext" text-anchor="middle">Your team</text>
    <text x="655" y="607" class="hosttext" text-anchor="middle">OpenCrawl</text>
  </g>
  <g>
    <text x="24" y="639" class="cellhead" text-anchor="start">Open-source self-hosting</text>
    <text x="326" y="639" class="teamtext" text-anchor="middle">Your team</text>
    <text x="488" y="639" class="teamtext" text-anchor="middle">Your team</text>
    <text x="655" y="639" class="teamtext" text-anchor="middle">Your team</text>
  </g>
</svg>
